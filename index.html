<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f7" />
  <meta name="description" content="Мой кошелёк: удобный учёт доходов и расходов без рекламы" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Мой кошелёк</title>
  <link rel="stylesheet" href="./style.css" /><link rel="stylesheet" href="./premium.css" />
</head>
<body>
<!-- Locally defined line icons: no icon font, account, or external dependency. -->
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="15" rx="3"/><path d="M3 9V5a2 2 0 0 1 2-2h13M16 13h5M16 16h.01"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M12 3v9h9"/><path d="M20.1 15A9 9 0 1 1 9 3.5"/><path d="M14 3.3A9 9 0 0 1 20.7 10H14z"/></symbol>
  <symbol id="i-budget" viewBox="0 0 24 24"><rect x="3" y="11" width="4" height="10" rx="1"/><rect x="10" y="3" width="4" height="18" rx="1"/><rect x="17" y="8" width="4" height="13" rx="1"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7"/><path d="m16 16 5 5"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18M7 12h10M10 19h4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 6 12 12M18 8v10H8"/></symbol>
  <symbol id="i-transfer" viewBox="0 0 24 24"><path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/></symbol>
</svg>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img class="aside-brand" src="./assets/logo-light.webp" alt="Логотип семейного кошелька"><div>Мой кошелёк<small>Семейные финансы</small></div></div>
    <nav class="side-nav" aria-label="Основная навигация">
      <button data-page="dashboard" class="nav active"><svg class="ico"><use href="#i-home"/></svg>Главная</button>
      <button data-page="accounts" class="nav"><svg class="ico"><use href="#i-wallet"/></svg>Счета</button>
      <button data-page="overview" class="nav"><svg class="ico"><use href="#i-chart"/></svg>Обзор</button>
      <button data-page="house" class="nav"><span class="nav-emoji">⌂</span>Наш дом</button>
      <button data-page="settings" class="nav"><svg class="ico"><use href="#i-more"/></svg>Больше</button>
    </nav>
    <div class="aside-foot"><span class="offline-dot"></span> История на устройстве<br/><small>Резервные копии — в разделе «Больше»</small></div>
  </aside>
  <main class="main">
    <header class="topbar premium-topbar">
      <div class="premium-branding"><img id="brand-mascot" class="premium-mascot" src="./assets/logo-man.webp" alt="Семейный логотип"/><div class="premium-brand-copy"><div class="premium-brand-sub" id="brand-profile-sub">Личный бюджет</div><h1 id="brand-profile-title">Мой кошелёк</h1><div class="premium-header-page" id="page-title">Главная</div></div></div>
      <div class="top-actions premium-actions">
        <button class="desktop-quick-add" type="button" data-action="add-tx" title="Добавить доход или расход">＋ Добавить</button>
        <label class="search-pill" for="global-search"><svg class="ico"><use href="#i-search"/></svg><input id="global-search" type="search" placeholder="Поиск операций" aria-label="Поиск операций" autocomplete="off"/></label>
        <button class="filter-round" id="open-filters" aria-label="Поиск и фильтры операций" title="Поиск и фильтры операций"><svg class="ico"><use href="#i-search"/></svg></button>
        <select aria-label="Выбранный кошелёк" id="wallet-picker"></select>
      </div>
    </header>
    <div id="profile-switch"></div>
    <div id="content"></div>
  </main>
</div>
<button class="floating-add" id="floating-add" aria-label="Добавить операцию" title="Добавить операцию"><svg class="ico"><use href="#i-plus"/></svg></button>
<nav class="mobile-nav" aria-label="Основная навигация">
  <button data-page="dashboard" class="active"><svg class="ico"><use href="#i-home"/></svg><span>Главная</span></button>
  <button data-page="accounts"><svg class="ico"><use href="#i-wallet"/></svg><span>Счета</span></button>
  <button data-page="overview"><svg class="ico"><use href="#i-chart"/></svg><span>Обзор</span></button>
  <button data-page="house"><svg class="ico"><use href="#i-home"/></svg><span>Наш дом</span></button>
  <button data-page="settings"><svg class="ico"><use href="#i-more"/></svg><span>Больше</span></button>
</nav>
<div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
